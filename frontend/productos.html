<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPot · Menú</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <a href="menu.html" class="boton-icono" title="Volver al menú">
      <span class="icono" aria-hidden="true">arrow_back</span>
    </a>
    <h1>Productos y menú</h1>
  </header>

  <!-- RF-04.2 Consultar productos y platos -->
  <main class="contenido">
    <form class="campo buscador" id="form-buscar" role="search">
      <span class="icono" aria-hidden="true">search</span>
      <input id="buscar" type="search" placeholder="Buscar por código o nombre"
             aria-label="Buscar productos">
      <button type="button" class="boton-icono" id="limpiar" title="Limpiar">
        <span class="icono" aria-hidden="true">close</span>
      </button>
    </form>

    <div class="categorias" id="categorias" role="group" aria-label="Filtrar por categoría"></div>

    <div class="estado" id="estado" hidden>
      <p id="estado-texto"></p>
      <button type="button" class="boton-texto" id="reintentar" hidden>Reintentar</button>
    </div>
    <ul class="lista" id="lista"></ul>
  </main>

  <button type="button" class="boton-principal boton-flotante" id="boton-nuevo" hidden>
    <span class="icono" aria-hidden="true">add</span> Nuevo
  </button>

  <!-- RF-04.1 Registrar / RF-04.3 Modificar / RF-04.4 Receta / RF-04.5 Precio / RF-04.6 Disponibilidad -->
  <dialog id="dialogo-producto" class="ancho">
    <form id="form-producto" novalidate>
      <h2 id="titulo-formulario">Nuevo producto</h2>

      <h3 class="titulo-seccion"><span class="icono" aria-hidden="true">restaurant_menu</span>Datos del plato</h3>
      <div class="dos-columnas">
        <div>
          <label class="etiqueta" for="f-codigo">Código *</label>
          <div class="campo" id="campo-codigo"><input id="f-codigo" placeholder="PRD-009" autocomplete="off"></div>
          <small class="error-campo" id="error-codigo"></small>
        </div>
        <div>
          <label class="etiqueta" for="f-categoria">Categoría *</label>
          <div class="campo" id="campo-categoria"><select id="f-categoria"></select></div>
          <small class="error-campo" id="error-categoria"></small>
        </div>
      </div>

      <label class="etiqueta" for="f-nombre">Nombre *</label>
      <div class="campo" id="campo-nombre"><input id="f-nombre" autocomplete="off"></div>
      <small class="error-campo" id="error-nombre"></small>

      <label class="etiqueta" for="f-descripcion">Descripción</label>
      <div class="campo"><input id="f-descripcion" autocomplete="off" maxlength="255"></div>

      <!-- RF-04.4 Asociar insumos a productos -->
      <section class="seccion">
        <h3 class="titulo-seccion"><span class="icono" aria-hidden="true">payments</span>Precio y receta</h3>
        <label class="etiqueta" for="f-precio">Precio de venta ($) *</label>
        <div class="campo" id="campo-precio"><input id="f-precio" type="number" min="0" step="any"></div>
        <small class="error-campo" id="error-precio"></small>

        <p class="etiqueta">Receta por porción</p>
        <p class="nota">Cuánto de cada insumo lleva una porción. Con esto se calcula el costo del plato.</p>
        <div class="lineas" id="lineas-receta"></div>
        <div class="linea" id="agregar-linea">
          <div class="campo"><select id="nuevo-insumo" aria-label="Insumo a agregar"></select></div>
          <div class="campo"><input id="nueva-cantidad" type="number" min="0" step="any" placeholder="Cantidad" aria-label="Cantidad por porción"></div>
          <button type="button" class="boton-icono" id="agregar-insumo" title="Agregar insumo">
            <span class="icono" aria-hidden="true">add_circle</span>
          </button>
        </div>
        <small class="error-campo" id="error-receta"></small>
        <div class="costos-plato" id="costos" aria-live="polite"></div>
      </section>

      <div class="seccion">
        <h3 class="titulo-seccion"><span class="icono" aria-hidden="true">menu_book</span>En la carta</h3>
        <label class="interruptor">
          <span>Disponible hoy<small>Si se acaba, apágalo y sale de la carta</small></span>
          <input type="checkbox" id="f-disponible" checked>
        </label>
        <label class="interruptor" id="bloque-activo">
          <span>Producto activo<small>Un producto inactivo ya no está en la carta</small></span>
          <input type="checkbox" id="f-activo" checked>
        </label>
      </div>

      <div class="alerta-error" id="error-formulario" role="alert" hidden></div>

      <div class="acciones fijas">
        <button type="button" class="boton-texto" id="cancelar">Cerrar</button>
        <button type="submit" class="boton-principal" id="guardar">
          <span class="icono" aria-hidden="true">save</span> Guardar
        </button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/productos.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPot · Compras</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <a href="proveedores.html" class="boton-icono" title="Volver a proveedores">
      <span class="icono" aria-hidden="true">arrow_back</span>
    </a>
    <h1>Órdenes de compra</h1>
  </header>

  <main class="contenido">
    <div class="filtros">
      <div class="campo">
        <span class="icono" aria-hidden="true">filter_list</span>
        <select id="filtro-estado" aria-label="Filtrar por estado">
          <option value="">Todos los estados</option>
          <option value="PENDIENTE">Pendientes</option>
          <option value="ENVIADA">Enviadas</option>
          <option value="RECIBIDA">Recibidas</option>
          <option value="CANCELADA">Canceladas</option>
        </select>
      </div>
    </div>

    <div class="estado" id="estado" hidden>
      <p id="estado-texto"></p>
      <button type="button" class="boton-texto" id="reintentar" hidden>Reintentar</button>
    </div>
    <ul class="lista" id="lista"></ul>
  </main>

  <button type="button" class="boton-principal boton-flotante" id="boton-nueva" hidden>
    <span class="icono" aria-hidden="true">add_shopping_cart</span> Nueva orden
  </button>

  <!-- RF-02.6 Registrar orden de compra -->
  <dialog id="dialogo-nueva" class="ancho">
    <form id="form-orden" novalidate>
      <h2>Nueva orden de compra</h2>

      <label class="etiqueta" for="f-proveedor">Proveedor *</label>
      <div class="campo" id="campo-proveedor"><select id="f-proveedor"></select></div>
      <small class="error-campo" id="error-proveedor"></small>

      <label class="etiqueta" for="f-entrega">Fecha estimada de entrega</label>
      <div class="campo"><input id="f-entrega" type="date"></div>

      <label class="etiqueta" for="f-observaciones">Observaciones</label>
      <div class="campo"><input id="f-observaciones" autocomplete="off"></div>

      <section class="seccion">
        <h3>Insumos a comprar</h3>
        <p class="nota">Cantidad · Precio unitario. Si el proveedor tiene un precio de referencia, se llena solo.</p>
        <div class="lineas" id="lineas"></div>
        <button type="button" class="boton-texto" id="agregar-linea">
          <span class="icono" aria-hidden="true">add</span> Agregar insumo
        </button>
        <small class="error-campo" id="error-lineas"></small>
        <p class="total" id="total">Total: $ 0</p>
      </section>

      <div class="alerta-error" id="error-nueva" role="alert" hidden></div>

      <div class="acciones">
        <button type="button" class="boton-texto" id="cancelar-nueva">Cancelar</button>
        <button type="submit" class="boton-principal" id="guardar-orden">
          <span class="icono" aria-hidden="true">save</span> Registrar orden
        </button>
      </div>
    </form>
  </dialog>

  <!-- Detalle de una orden y RF-02.7 / RF-02.8 cambio de estado -->
  <dialog id="dialogo-detalle" class="ancho">
    <h2 id="detalle-titulo"></h2>
    <dl class="datos-orden" id="detalle-datos"></dl>
    <section class="seccion">
      <h3>Insumos</h3>
      <ul class="mini-lista" id="detalle-lineas"></ul>
      <p class="total" id="detalle-total"></p>
    </section>
    <div class="alerta-error" id="error-detalle" role="alert" hidden></div>
    <div class="acciones" id="detalle-acciones"></div>
  </dialog>

  <script type="module" src="js/compras.js"></script>
</body>
</html>

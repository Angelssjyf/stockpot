<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPot · Reservas</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <a href="menu.html" class="boton-icono" title="Volver al menú">
      <span class="icono" aria-hidden="true">arrow_back</span>
    </a>
    <h1>Reservas</h1>
  </header>

  <!-- RF-07.2 Consultar reservas del día -->
  <main class="contenido">
    <form class="filtros" id="form-dia">
      <div class="campo"><input type="date" id="dia" aria-label="Día"></div>
      <div class="campo buscador">
        <span class="icono" aria-hidden="true">search</span>
        <input id="buscar" type="search" placeholder="Buscar cliente" aria-label="Buscar reservas">
      </div>
    </form>
    <div class="categorias" id="atajos" role="group" aria-label="Día"></div>

    <div class="resumen" id="resumen"></div>

    <div class="estado" id="estado" hidden>
      <p id="estado-texto"></p>
      <button type="button" class="boton-texto" id="reintentar" hidden>Reintentar</button>
    </div>
    <ul class="lista" id="lista"></ul>
  </main>

  <button type="button" class="boton-principal boton-flotante" id="boton-nuevo" hidden>
    <span class="icono" aria-hidden="true">event_available</span> Nueva reserva
  </button>

  <!-- RF-07.1 Registrar y RF-07.3 Modificar -->
  <dialog id="dialogo-reserva">
    <form id="form-reserva" novalidate>
      <h2 id="titulo-formulario">Nueva reserva</h2>

      <label class="etiqueta" for="f-cliente">Nombre del cliente *</label>
      <div class="campo" id="campo-cliente"><input id="f-cliente" autocomplete="off"></div>
      <small class="error-campo" id="error-cliente"></small>

      <label class="etiqueta" for="f-telefono">Teléfono *</label>
      <div class="campo" id="campo-telefono"><input id="f-telefono" type="tel" autocomplete="off"></div>
      <small class="error-campo" id="error-telefono"></small>

      <div class="dos-columnas">
        <div>
          <label class="etiqueta" for="f-fecha">Fecha *</label>
          <div class="campo" id="campo-fecha"><input id="f-fecha" type="date"></div>
          <small class="error-campo" id="error-fecha"></small>
        </div>
        <div>
          <label class="etiqueta" for="f-hora">Hora *</label>
          <div class="campo" id="campo-hora"><input id="f-hora" type="time" step="900"></div>
          <small class="error-campo" id="error-hora"></small>
        </div>
      </div>

      <div class="dos-columnas">
        <div>
          <label class="etiqueta" for="f-personas">Personas *</label>
          <div class="campo" id="campo-personas"><input id="f-personas" type="number" min="1" max="30" value="2"></div>
          <small class="error-campo" id="error-personas"></small>
        </div>
        <div>
          <label class="etiqueta" for="f-duracion">Duración</label>
          <div class="campo">
            <select id="f-duracion">
              <option value="60">1 hora</option>
              <option value="90">1 h 30 min</option>
              <option value="120" selected>2 horas</option>
              <option value="180">3 horas</option>
              <option value="240">4 horas</option>
            </select>
          </div>
        </div>
      </div>

      <!-- RF-07.6 y RF-07.7: solo se ofrecen las mesas libres para ese horario y número de personas -->
      <label class="etiqueta">Mesa *</label>
      <p class="nota" id="ayuda-mesas">Elige fecha, hora y personas para ver las mesas libres.</p>
      <div class="opciones-mesa" id="opciones-mesa" role="radiogroup" aria-label="Mesa"></div>
      <small class="error-campo" id="error-mesa"></small>

      <label class="etiqueta" for="f-observaciones">Observaciones</label>
      <div class="campo"><input id="f-observaciones" maxlength="200" placeholder="Cumpleaños, silla para bebé…" autocomplete="off"></div>

      <div class="alerta-error" id="error-formulario" role="alert" hidden></div>

      <div class="acciones">
        <button type="button" class="boton-texto" id="cancelar">Cancelar</button>
        <button type="submit" class="boton-principal" id="guardar">
          <span class="icono" aria-hidden="true">save</span> Guardar
        </button>
      </div>
    </form>
  </dialog>

  <!-- Detalle de una reserva: RF-07.8 cambiar su estado y RF-07.4 cancelarla -->
  <dialog id="dialogo-detalle">
    <h2 id="detalle-titulo"></h2>
    <dl class="datos-orden" id="detalle-datos"></dl>
    <div class="alerta-error" id="error-detalle" role="alert" hidden></div>
    <div class="acciones" id="detalle-acciones"></div>
  </dialog>

  <script type="module" src="js/reservas.js"></script>
</body>
</html>

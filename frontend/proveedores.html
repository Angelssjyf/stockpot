<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPot · Proveedores</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <a href="menu.html" class="boton-icono" title="Volver al menú">
      <span class="icono" aria-hidden="true">arrow_back</span>
    </a>
    <h1>Proveedores</h1>
    <!-- RF-02.6 a RF-02.8: las órdenes de compra son parte de este módulo -->
    <a href="compras.html" class="boton-texto" id="ir-compras" hidden>
      <span class="icono" aria-hidden="true">shopping_cart</span> Órdenes de compra
    </a>
  </header>

  <!-- RF-02.2 Consultar proveedores -->
  <main class="contenido">
    <form class="campo buscador" id="form-buscar" role="search">
      <span class="icono" aria-hidden="true">search</span>
      <input id="buscar" type="search" placeholder="Buscar por razón social, NIT o contacto"
             aria-label="Buscar proveedores">
      <button type="button" class="boton-icono" id="limpiar" title="Limpiar">
        <span class="icono" aria-hidden="true">close</span>
      </button>
    </form>

    <div class="estado" id="estado" hidden>
      <p id="estado-texto"></p>
      <button type="button" class="boton-texto" id="reintentar" hidden>Reintentar</button>
    </div>
    <ul class="lista" id="lista"></ul>
  </main>

  <button type="button" class="boton-principal boton-flotante" id="boton-nuevo" hidden>
    <span class="icono" aria-hidden="true">add</span> Nuevo
  </button>

  <!-- RF-02.1 Registrar / RF-02.3 Modificar / RF-02.4 Insumos / RF-02.5 Historial -->
  <dialog id="dialogo-proveedor" class="ancho">
    <form id="form-proveedor" novalidate>
      <h2 id="titulo-formulario">Nuevo proveedor</h2>

      <label class="etiqueta" for="f-nit">NIT *</label>
      <div class="campo" id="campo-nit"><input id="f-nit" autocomplete="off"></div>
      <small class="error-campo" id="error-nit"></small>

      <label class="etiqueta" for="f-razon">Razón social *</label>
      <div class="campo" id="campo-razon"><input id="f-razon" autocomplete="off"></div>
      <small class="error-campo" id="error-razon"></small>

      <label class="etiqueta" for="f-contacto">Persona de contacto</label>
      <div class="campo"><input id="f-contacto" autocomplete="off"></div>

      <label class="etiqueta" for="f-telefono">Teléfono</label>
      <div class="campo"><input id="f-telefono" type="tel" autocomplete="off"></div>

      <label class="etiqueta" for="f-email">Correo</label>
      <div class="campo" id="campo-email"><input id="f-email" type="email" autocomplete="off"></div>
      <small class="error-campo" id="error-email"></small>

      <label class="etiqueta" for="f-direccion">Dirección</label>
      <div class="campo"><input id="f-direccion" autocomplete="off"></div>

      <div id="bloque-edicion">
        <label class="interruptor">
          <span>Proveedor activo<small>A un proveedor inactivo no se le pueden hacer órdenes de compra</small></span>
          <input type="checkbox" id="f-activo">
        </label>

        <!-- RF-02.4 Productos suministrados -->
        <section class="seccion">
          <h3>Insumos que vende</h3>
          <p class="nota">Precio de referencia: lo que normalmente cobra este proveedor.</p>
          <div class="lineas" id="lineas-insumos"></div>
          <div class="linea">
            <div class="campo"><select id="nuevo-insumo" aria-label="Insumo a agregar"></select></div>
            <div class="campo"><input id="nuevo-precio" type="number" min="0" step="any" placeholder="Precio" aria-label="Precio de referencia"></div>
            <button type="button" class="boton-icono" id="agregar-insumo" title="Agregar insumo">
              <span class="icono" aria-hidden="true">add_circle</span>
            </button>
          </div>
        </section>

        <!-- RF-02.5 Historial de compras -->
        <section class="seccion">
          <h3>Historial de compras</h3>
          <ul class="mini-lista" id="historial"></ul>
        </section>
      </div>

      <div class="alerta-error" id="error-formulario" role="alert" hidden></div>

      <div class="acciones">
        <button type="button" class="boton-texto" id="cancelar">Cerrar</button>
        <button type="submit" class="boton-principal" id="guardar">
          <span class="icono" aria-hidden="true">save</span> Guardar
        </button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/proveedores.js"></script>
</body>
</html>
